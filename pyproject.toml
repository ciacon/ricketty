[project]
name = "ricketty"
version = "0.1.0"
description = "A derpy, slow-drivelling terminal information screen."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "rich>=14.0",
    "textual>=8.0",
]

[project.scripts]
ricketty = "ricketty.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pyright>=1.1",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
